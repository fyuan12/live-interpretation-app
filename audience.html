<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Island Crest Ward Live Interpreter 岛冠支会实时翻译</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&family=Lora:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0f1a;
            --color-surface: #141b2d;
            --color-surface-elevated: #1c2541;
            --color-border: #2d3a5c;
            --color-text-primary: #f0f4fc;
            --color-text-secondary: #8892a8;
            --color-text-muted: #5c6478;
            --color-accent: #4a9eff;
            --color-success: #34d399;
            --color-error: #f87171;
            --color-warning: #fbbf24;

            --font-english: 'Source Serif 4', Georgia, serif;
            --font-chinese: 'Noto Sans SC', 'PingFang SC', sans-serif;
            --font-ui: system-ui, -apple-system, sans-serif;

            --font-size-translation: 1.5rem;
            --font-size-source: 1rem;

            --radius-sm: 6px;
            --radius-md: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-ui);
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-align: center;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        @media (max-width: 500px) {
            .app-title { display: none; }
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-text-muted);
            transition: all 0.3s ease;
        }

        .status-dot.listening {
            background: var(--color-success);
            box-shadow: 0 0 12px var(--color-success);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.disconnected {
            background: var(--color-error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }

        .direction-badge {
            padding: 4px 10px;
            background: var(--color-surface-elevated);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-accent);
        }

        .settings-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .settings-btn:hover {
            background: var(--color-border);
            color: var(--color-text-primary);
        }

        .settings-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Source Panel (Collapsible) */
        .source-panel {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .source-panel.expanded {
            max-height: 200px;
        }

        .source-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            background: var(--color-surface-elevated);
            border: none;
            border-bottom: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            flex-shrink: 0;
        }

        .source-toggle:hover {
            background: var(--color-border);
        }

        .source-toggle svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .source-toggle.expanded svg {
            transform: rotate(180deg);
        }

        .source-content {
            padding: 16px;
            font-family: var(--font-english);
            font-size: var(--font-size-source);
            color: var(--color-text-secondary);
            overflow-y: auto;
            max-height: 150px;
        }

        .source-content p {
            margin-bottom: 0.75em;
        }

        .source-content p:last-child {
            margin-bottom: 0;
            color: var(--color-text-primary);
        }

        /* Translation Panel */
        .translation-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .translation-content {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            font-family: var(--font-chinese);
            font-size: var(--font-size-translation);
            line-height: 1.7;
            -webkit-overflow-scrolling: touch;
        }

        .translation-content .spacer {
            flex: 1;
            min-height: 0;
        }

        .translation-content p {
            margin-bottom: 1em;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.3s ease forwards;
        }

        .translation-content p:last-child {
            color: var(--color-text-primary);
        }

        .translation-content p:not(:last-child) {
            color: var(--color-text-secondary);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .placeholder {
            color: var(--color-text-muted);
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }

        /* Connection Error */
        .error-message {
            display: none;
            padding: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }

        .error-message.visible {
            display: block;
        }

        .error-message h2 {
            color: var(--color-error);
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .error-message p {
            margin-bottom: 16px;
        }

        .error-message button {
            padding: 10px 24px;
            background: var(--color-accent);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm);
        }

        .close-btn:hover {
            background: var(--color-surface-elevated);
            color: var(--color-text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: 1rem;
        }

        .form-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--color-surface-elevated);
            border-radius: 3px;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .form-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--color-accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .font-preview {
            padding: 16px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            margin-top: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }

        .btn-secondary {
            background: var(--color-surface-elevated);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
        }

        .btn-primary {
            background: var(--color-accent);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-text-muted); border-radius: 3px; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
            <span class="direction-badge" id="directionBadge">EN → 中文</span>
        </div>
        <span class="app-title">Island Crest Ward Live Interpreter 岛冠支会实时翻译</span>
        <button class="settings-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- Source Toggle -->
    <button class="source-toggle" id="sourceToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
        <span id="sourceToggleText">Show source text</span>
    </button>

    <!-- Source Panel (Collapsible) -->
    <div class="source-panel" id="sourcePanel">
        <div class="source-content" id="sourceContent">
            <p class="placeholder">Source text will appear here...</p>
        </div>
    </div>

    <!-- Main Translation Panel -->
    <div class="translation-panel">
        <div class="translation-content" id="translationContent">
            <div class="spacer"></div>
            <p class="placeholder" id="translationPlaceholder">Waiting for translation...</p>
        </div>

        <!-- Error State -->
        <div class="error-message" id="errorMessage">
            <h2>Connection Lost</h2>
            <p>Unable to connect to the interpreter session.</p>
            <button id="retryBtn">Retry Connection</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Display Settings</h2>
                <button class="close-btn" id="closeSettings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="form-group">
                <label>Translation Font</label>
                <select id="translationFont">
                    <option value="'Noto Sans SC', 'PingFang SC', sans-serif">Noto Sans SC</option>
                    <option value="'Noto Serif SC', 'Songti SC', serif">Noto Serif SC</option>
                    <option value="'ZCOOL XiaoWei', serif">ZCOOL XiaoWei</option>
                    <option value="'Source Serif 4', Georgia, serif">Source Serif 4</option>
                    <option value="'Merriweather', Georgia, serif">Merriweather</option>
                    <option value="system-ui, sans-serif">System Default</option>
                </select>
            </div>

            <div class="form-group">
                <label>Translation Size: <span id="translationSizeValue">1.5</span>rem</label>
                <input type="range" id="translationSize" min="1" max="3" step="0.25" value="1.5">
            </div>

            <div class="font-preview" id="fontPreview">
                天父爱我们每一个人。The gospel brings peace and joy.
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" id="resetSettings">Reset</button>
                <button class="btn-primary" id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <script src="audience.js"></script>
</body>
</html>
